# Activated with --spring.profiles.active=local (see README "Running locally").
# Points at the Postgres container started by docker-compose.yml and enables the
# demo data seed migration, neither of which should ever be active in a deployed environment.

spring.datasource.url=jdbc:postgresql://localhost:5432/safezone
spring.datasource.username=safezone
spring.datasource.password=safezone

spring.flyway.locations=classpath:db/migration,classpath:db/seed
