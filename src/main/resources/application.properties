spring.application.name=safezone-backend

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JwtAuthenticationFilter + SecurityConfig own authentication entirely (no
# AuthenticationManager/UserDetailsService involved) - without this exclusion, Spring Boot
# still auto-creates an unused in-memory user with a random generated password on every
# startup, which is just noise (and looks like an incomplete security setup) in the logs.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,modulith

# Dev-only default (32+ bytes, required for HS256) - staging/production MUST override via
# the JWT_SECRET env var. Never commit a real secret here.
jwt.secret=${JWT_SECRET:local-dev-only-secret-key-please-override-in-prod-env}
jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:30}
jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:14}

# Comma-separated. Override via CORS_ALLOWED_ORIGINS in staging/production.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
