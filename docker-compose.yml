services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: safezone
      POSTGRES_USER: safezone
      POSTGRES_PASSWORD: safezone
    ports:
      - "5432:5432"
    volumes:
      - safezone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safezone -d safezone"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  safezone_pgdata:
