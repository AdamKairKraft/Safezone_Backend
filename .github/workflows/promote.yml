name: Promote dev to staging and production

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [staging, production]
      fail-fast: false
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Fast-forward ${{ matrix.target }} to dev
        run: git push origin HEAD:${{ matrix.target }}
